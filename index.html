<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Konstellation — dina tio siffror, ditt mönster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,460;0,9..144,620;1,9..144,400&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B101D; --bg2:#0E1426; --panel:rgba(148,168,220,.055); --panel2:rgba(148,168,220,.09);
  --line:rgba(232,199,118,.14); --hair:rgba(160,175,210,.12);
  --text:#EAEDF6; --muted:#8E96AE; --faint:#5B6379;
  --gold:#E8C776; --gold-dim:rgba(232,199,118,.55);
  --eld:#ED9B75; --jord:#B4C98B; --luft:#93B7EC; --vatten:#7BD1C0;
  --danger:#E88A8A; --ok:#9BD1A6;
  --r:18px; --r-s:12px;
  --disp:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Sora",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:#060910;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;
  min-height:100dvh;display:flex;justify-content:center}
#frame{width:100%;max-width:440px;min-height:100dvh;position:relative;background:
  radial-gradient(120% 60% at 50% -5%, #17203B 0%, var(--bg) 55%, #080C16 100%);
  box-shadow:0 0 90px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
#sky{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.9}
#appwrap{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
main{flex:1;overflow-y:auto;padding:0 18px 108px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* ---------- Typography ---------- */
h1,h2,h3,.disp{font-family:var(--disp);font-weight:460;letter-spacing:.005em}
h1{font-size:30px;line-height:1.15}
h2{font-size:21px;line-height:1.2}
h3{font-size:16px}
.eyebrow{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
.serif-i{font-family:var(--disp);font-style:italic;font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* ---------- Cards & structure ---------- */
.card{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);padding:18px;margin-top:14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.gold{border-color:var(--line)}
.sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 2px}
.hairline{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:22px 0 4px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--hair);color:var(--muted);background:rgba(255,255,255,.02)}
.chip.on{border-color:var(--gold-dim);color:var(--gold);background:rgba(232,199,118,.08)}
.chip.mini{font-size:11px;padding:3px 9px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.pill-el{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
.el-Eld{color:var(--eld);background:rgba(237,155,117,.12)} .el-Jord{color:var(--jord);background:rgba(180,201,139,.12)}
.el-Luft{color:var(--luft);background:rgba(147,183,236,.12)} .el-Vatten{color:var(--vatten);background:rgba(123,209,192,.12)}
.tx-Eld{color:var(--eld)} .tx-Jord{color:var(--jord)} .tx-Luft{color:var(--luft)} .tx-Vatten{color:var(--vatten)}

/* ---------- Buttons & inputs ---------- */
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:var(--text)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;
  font-size:15px;font-weight:600;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,#EFD08A,#D8AE55);color:#241B08}
.btn-ghost{border:1px solid var(--hair);color:var(--text);background:rgba(255,255,255,.03)}
.btn-line{border:1px solid var(--line);color:var(--gold);background:rgba(232,199,118,.06)}
.btn-sm{width:auto;padding:9px 15px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.linkish{color:var(--gold);font-size:13.5px;font-weight:500;padding:6px 4px}
input,select{font-family:var(--sans);width:100%;background:rgba(10,14,26,.7);border:1px solid var(--hair);
  border-radius:13px;padding:14px 15px;font-size:16px;color:var(--text);outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--gold-dim)}
input.pnr{font-size:21px;letter-spacing:.14em;text-align:center;font-variant-numeric:tabular-nums}
input.err{border-color:var(--danger)}
label.fld{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;letter-spacing:.04em}
.fieldmsg{font-size:12.5px;margin-top:8px;min-height:18px}
.fieldmsg.bad{color:var(--danger)} .fieldmsg.good{color:var(--ok)}
:focus-visible{outline:2px solid var(--gold-dim);outline-offset:2px;border-radius:6px}

/* ---------- Tab bar ---------- */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:40;
  display:flex;padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(9,13,23,.6),rgba(9,13,23,.96) 40%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--faint);
  font-size:10.5px;font-weight:500;letter-spacing:.05em;border-radius:12px;transition:color .2s}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold)}
.tab .dotmark{width:3px;height:3px;border-radius:99px;background:transparent;margin-top:1px}
.tab.on .dotmark{background:var(--gold)}

/* ---------- Header ---------- */
.viewhead{padding:26px 2px 4px}
.viewhead .eyebrow{display:block;margin-bottom:5px}

/* ---------- Score dial ---------- */
.dial{position:relative;width:150px;height:150px;margin:6px auto}
.dial svg{transform:rotate(-90deg)}
.dial .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .val b{font-family:var(--disp);font-size:40px;font-weight:460;line-height:1}
.dial .val span{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:4px}

/* ---------- Bars ---------- */
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A75B,var(--gold));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.barrow{display:flex;align-items:center;gap:11px;margin-top:11px;font-size:12.5px}
.barrow .lab{width:92px;color:var(--muted);flex-shrink:0}
.barrow .pct{width:38px;text-align:right;color:var(--text);font-weight:500;flex-shrink:0}

/* ---------- People list ---------- */
.pcard{display:flex;align-items:center;gap:13px;padding:13px 14px;margin-top:10px;background:var(--panel);
  border:1px solid var(--hair);border-radius:15px;width:100%;text-align:left;transition:background .2s}
.pcard:active{background:var(--panel2)}
.avatar{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:var(--disp);font-size:17px;border:1px solid var(--hair);position:relative}
.avatar .zsym{position:absolute;bottom:-4px;right:-4px;font-size:11px;background:var(--bg2);border:1px solid var(--hair);
  border-radius:99px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-family:var(--sans)}
.pmeta{flex:1;min-width:0}
.pmeta b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matchbadge{font-size:12px;font-weight:600;color:var(--gold);flex-shrink:0;text-align:right}
.matchbadge small{display:block;font-size:9.5px;color:var(--faint);font-weight:500;letter-spacing:.08em}

/* ---------- Sheets ---------- */
#scrim{position:fixed;inset:0;background:rgba(4,6,12,.6);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);width:100%;max-width:440px;max-height:88dvh;
  z-index:70;background:linear-gradient(180deg,#141B30,#0E1424);border-radius:24px 24px 0 0;border:1px solid var(--hair);border-bottom:none;
  transition:transform .32s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column}
.sheet.show{transform:translate(-50%,0)}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);margin:10px auto 2px;flex-shrink:0}
.sheet .body{overflow-y:auto;padding:10px 20px calc(26px + env(safe-area-inset-bottom));scrollbar-width:none}
.sheet .body::-webkit-scrollbar{display:none}

/* ---------- Onboarding ---------- */

/* --- v2 --- */
.nowgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.nowcell{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.nowcell b{font-family:var(--disp);font-size:19px;display:block}
.nowcell span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.nowline{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--muted)}
.nowline .moonchip{font-size:19px}
.moonbig{font-size:56px;text-align:center;line-height:1;filter:drop-shadow(0 0 18px rgba(232,199,118,.25))}
.dayrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .dnum{font-family:var(--disp);font-size:15px;color:var(--gold);min-width:76px}
.dayrow .dwhy{font-size:12.5px;color:var(--muted);flex:1}
.dayrow .dbar{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;flex-shrink:0}
.dayrow .dbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.staravatar{position:relative}
.staravatar::after{content:'✦';position:absolute;top:-7px;right:-7px;font-size:13px;color:var(--gold);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.sortseg{display:flex;gap:4px;margin-left:auto}
.sortseg button{font-size:10.5px;letter-spacing:.05em;color:var(--faint);padding:5px 9px;border-radius:9px;border:1px solid transparent}
.sortseg button.on{color:var(--gold);border-color:rgba(232,199,118,.3);background:rgba(232,199,118,.06)}

/* --- v3 --- */
.p4ghost{display:block;margin:8px auto 0;font-size:11.5px;color:var(--gold-dim);border:1px dashed rgba(232,199,118,.3);border-radius:99px;padding:5px 13px}
.digitband .p4{opacity:.55;width:22px;height:32px;font-size:17px}
.digitband .dsep{color:var(--faint);align-self:center;font-size:14px;width:auto}
.dprof{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:12px;align-items:end;height:64px}
.dprof .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.dprof .col i{display:block;width:70%;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold-dim));min-height:3px}
.dprof .col.zero i{background:rgba(255,255,255,.09)}
.dprof .col span{font-size:10px;color:var(--faint);font-family:var(--disp)}
.strip7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.strip7 .sd{text-align:center;padding:8px 2px 7px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.strip7 .sd b{display:block;width:9px;height:9px;border-radius:50%;margin:0 auto 5px}
.strip7 .sd span{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.strip7 .sd.crit{border-color:rgba(232,199,118,.4)}
.ovrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.025);margin-top:9px}
.ovrow .rank{font-family:var(--disp);font-size:13px;color:var(--faint);min-width:20px}
.ovrow .meta{flex:1;min-width:0}
.ovrow .meta b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovrow .meta .why{font-size:11.5px;color:var(--muted);margin-top:2px}
.ovrow .nums{text-align:right;flex-shrink:0}
.ovrow .nums .sc{font-family:var(--disp);font-size:19px;color:var(--gold)}
.ovrow .nums .fs{font-size:10.5px;color:var(--muted)}
.trend{font-size:11px}.trend.up{color:#9AD9A5}.trend.dn{color:#E09B8E}.trend.flat{color:var(--faint)}
.deepbadge{font-size:9px;letter-spacing:.09em;color:var(--gold);border:1px solid rgba(232,199,118,.4);border-radius:6px;padding:2px 5px;vertical-align:2px;margin-left:6px}
.sharedd{display:inline-flex;gap:5px;margin-top:8px}
.sharedd i{font-style:normal;font-family:var(--disp);width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(232,199,118,.1);color:var(--gold);font-size:13px;border:1px solid rgba(232,199,118,.25)}

/* --- v4 --- */
.talgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.talcell{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:15px;padding:12px 6px;text-align:center;transition:border-color .2s}
.talcell:active{border-color:rgba(232,199,118,.5)}
.talcell b{font-family:var(--disp);font-size:25px;color:var(--gold);display:block;line-height:1.1}
.talcell span{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);display:block;margin-top:4px}
.talcell.ghost{border-style:dashed}.talcell.ghost b{color:var(--faint);font-size:19px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.duocard{border:1px solid var(--line);border-radius:16px;padding:13px 11px;background:rgba(255,255,255,.025);text-align:center}
.duocard .nm{font-weight:600;font-size:14px}
.duocard .es{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.insrow{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.insrow:last-child{border:0}
.insrow .ic{font-size:16px;flex-shrink:0;width:24px;text-align:center}
.insrow p{font-size:13px;color:var(--muted);line-height:1.55}
.insrow p b{color:var(--text)}
.clearcmp{display:block;margin:10px auto 0;font-size:11.5px;color:var(--faint);text-decoration:underline;text-underline-offset:2px}
.editrow{display:flex;gap:9px;margin-top:16px}

/* --- v5 --- */
.gear{position:absolute;top:14px;right:16px;z-index:40;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:rgba(13,19,34,.66);backdrop-filter:blur(8px);
  color:var(--muted);font-size:17px;display:flex;align-items:center;justify-content:center}
.gear:active{color:var(--gold);border-color:rgba(232,199,118,.4)}
.valrows{margin:18px 0 4px}
.valrow{display:flex;gap:12px;align-items:flex-start;padding:9px 0}
.valrow .vi{font-size:17px;width:26px;text-align:center;flex-shrink:0;color:var(--gold)}
.valrow p{font-size:13px;color:var(--muted);line-height:1.5;text-align:left}
.valrow p b{color:var(--text)}
.setsec{margin-top:18px}
.setsec .eyebrow{display:block;margin-bottom:8px}
.setrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border:0}
.setrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .sub{font-size:11px;color:var(--faint);display:block}
.setrow .cb{width:20px;height:20px;border-radius:6px;border:1.4px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold)}
.setrow.sel .cb{border-color:var(--gold);background:rgba(232,199,118,.12)}
.setrow .mini-edit{color:var(--faint);font-size:15px;padding:4px 8px}
.danger{color:#E09B8E!important}
.minibars{display:flex;gap:5px;align-items:flex-end;height:34px}
.minibars i{width:9px;border-radius:2.5px 2.5px 0 0;display:block;min-height:3px}
.duorytm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.duorytm .cellr{border:1px solid var(--line);border-radius:14px;padding:11px;background:rgba(255,255,255,.02)}
.duorytm .cellr b{font-size:12.5px;display:block;margin-bottom:8px}
.duorytm .cellr .bd{font-size:10.5px;color:var(--faint);margin-top:7px;line-height:1.45}
#onb{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto;padding:0 26px 40px}
.onb-hero{padding-top:11dvh;text-align:center}
.wordmark{font-family:var(--disp);font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:460}
.onb-hero h1{font-size:36px;margin-top:22px;font-weight:340}
.onb-hero h1 em{font-style:italic;font-weight:400;color:var(--gold)}
.digitband{display:flex;justify-content:center;gap:6px;margin:26px 0 6px}
.digitband span{font-family:var(--disp);font-size:20px;color:var(--gold-dim);width:26px;height:36px;display:flex;
  align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:rgba(232,199,118,.04)}
.mode-toggle{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;padding:4px;margin-top:26px}
.mode-toggle button{flex:1;padding:9px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
.mode-toggle button.on{background:rgba(232,199,118,.12);color:var(--gold)}
.dob-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px}

/* ---------- Reveal ---------- */
#reveal{position:absolute;inset:0;z-index:55;background:radial-gradient(100% 70% at 50% 30%,#151F3B,#070A13 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;pointer-events:none;transition:opacity .4s}
#reveal.show{opacity:1;pointer-events:auto}
#revealStage{width:270px;height:270px;position:relative}
#revealStage .d{position:absolute;font-family:var(--disp);font-size:24px;color:var(--gold);left:50%;top:50%;
  transition:all 1.4s cubic-bezier(.3,.7,.3,1);opacity:0}
#revealTxt{font-family:var(--disp);font-style:italic;font-size:17px;color:var(--muted);transition:opacity .5s}

/* ---------- Me hero ---------- */
.mehero{margin-top:14px;padding:24px 20px 20px;border-radius:22px;position:relative;overflow:hidden;
  border:1px solid var(--line);background:linear-gradient(160deg,rgba(232,199,118,.08),rgba(148,168,220,.05) 45%,rgba(11,16,29,.2))}
.mehero .zbig{position:absolute;right:-8px;top:-16px;font-size:120px;opacity:.06;font-family:var(--sans)}
.pnrline{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.pnrline button{color:var(--faint);font-size:11px;text-decoration:underline;text-underline-offset:2px}
.idrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- Big number ---------- */
.bignum{font-family:var(--disp);font-size:64px;font-weight:340;line-height:1;color:var(--gold)}
.numsplit{display:flex;gap:18px;align-items:flex-start}
.numsplit .left{flex-shrink:0;text-align:center;width:76px}
.numsplit .left .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:5px}

/* ---------- Bio legend ---------- */
.biokey{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}

/* ---------- Compare picker ---------- */
.duel{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:6px;margin-top:14px}

.duelslot.filled{border-style:solid;border-color:var(--line)}
.duelslot b{font-size:13.5px;font-weight:600}
.duelslot .sub{font-size:11px;color:var(--muted)}
.vs{font-family:var(--disp);font-style:italic;color:var(--gold-dim);text-align:center;font-size:15px}

.seg button.on{background:rgba(232,199,118,.12);color:var(--gold)}

/* ---------- QR ---------- */
.qrbox{width:216px;height:216px;margin:16px auto 8px;background:#F3EFE4;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:14px}
.qrbox canvas,.qrbox img,.qrbox svg{border-radius:4px;max-width:100%;max-height:100%}
.codechip{display:flex;align-items:center;gap:9px;background:rgba(10,14,26,.7);border:1px solid var(--hair);border-radius:12px;
  padding:11px 13px;margin-top:12px}
.codechip code{flex:1;font-size:11.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:ui-monospace,monospace}
.scanframe{position:relative;height:230px;border-radius:18px;overflow:hidden;margin-top:14px;border:1px solid var(--hair);
  background:repeating-linear-gradient(0deg,#0A0F1D 0 3px,#0C1222 3px 6px)}
.scanframe .corner{position:absolute;width:26px;height:26px;border:2.5px solid var(--gold);opacity:.85}
.scanframe .laser{position:absolute;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--vatten),transparent);
  box-shadow:0 0 14px var(--vatten);animation:laser 2.4s ease-in-out infinite}
@keyframes laser{0%,100%{top:18%}50%{top:80%}}
.scanframe .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12.5px;text-align:center;padding:0 30px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#1C2542;border:1px solid var(--line);
  color:var(--text);padding:11px 18px;border-radius:99px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:all .3s;max-width:85%;text-align:center}

/* ---------- Group manage ---------- */

/* ---------- Anim helpers ---------- */
.fadein{animation:fin .5s ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}

@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}

.hidden{display:none!important}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt22{margin-top:22px}
.center{text-align:center}

<script>
'use strict';
/* ================= ENGINE ================= */
// ===== KONSTELLATION ENGINE (pure, deterministic) =====
const KE = (() => {

// ---------- Personnummer ----------
function luhnCheck(digits9) { // string of 9 digits YYMMDDNNN -> check digit
  let sum = 0;
  for (let i = 0; i < 9; i++) {
    let d = +digits9[i] * (i % 2 === 0 ? 2 : 1);
    if (d > 9) d -= 9;
    sum += d;
  }
  return (10 - (sum % 10)) % 10;
}

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

// Accepts: YYMMDD-XXXX, YYMMDDXXXX, YYYYMMDD-XXXX, YYYYMMDDXXXX, +-separator for 100+
function parsePersonnummer(raw) {
  const s = (raw || '').trim();
  const m = s.replace(/\s/g, '').match(/^(\d{2})?(\d{2})(\d{2})(\d{2})([-+]?)(\d{3})(\d)$/);
  if (!m) return { ok: false, error: 'format' };
  const [, cc, yy, mm, dd, sep, nnn, chk] = m;
  let year;
  const now = new Date();
  if (cc) {
    year = +(cc + yy);
  } else {
    const cur2 = now.getFullYear() % 100;
    year = (+yy <= cur2 ? 2000 : 1900) + +yy;
    if (sep === '+') year -= 100;
  }
  const month = +mm, day = +dd;
  if (month < 1 || month > 12 || day < 1 || day > daysInMonth(year, month)) return { ok: false, error: 'date' };
  if (year < 1900 || year > now.getFullYear()) return { ok: false, error: 'date' };
  const expect = luhnCheck(yy + mm + dd + nnn);
  if (expect !== +chk) return { ok: false, error: 'luhn', expected: expect };
  const gender = (+nnn[2]) % 2 === 1 ? 'man' : 'kvinna';
  const birth = new Date(year, month - 1, day);
  if (birth > now) return { ok: false, error: 'date' };
  return { ok: true, year, month, day, gender, pnr: `${yy}${mm}${dd}-${nnn}${chk}` };
}

function parseBirthdate(y, m, d) {
  const year = +y, month = +m, day = +d;
  const now = new Date();
  if (!year || !month || !day) return { ok: false, error: 'format' };
  if (year < 1900 || year > now.getFullYear() || month < 1 || month > 12 || day < 1 || day > daysInMonth(year, month)) return { ok: false, error: 'date' };
  if (new Date(year, month - 1, day) > now) return { ok: false, error: 'date' };
  return { ok: true, year, month, day, gender: null, pnr: null };
}

// ---------- Numerology ----------
function digitSum(n) { let s = 0; for (const c of String(n)) s += +c; return s; }
function reduce(n, keepMasters = true) {
  while (n > 9) {
    if (keepMasters && (n === 11 || n === 22 || n === 33)) return n;
    n = digitSum(n);
  }
  return n;
}
function lifePath(y, m, d) {
  // Standard: reduce year, month, day separately, then sum & reduce (masters kept)
  const t = reduce(digitSum(y)) + reduce(m > 9 ? digitSum(m) : m) + reduce(d > 9 ? digitSum(d) : d);
  return reduce(t);
}
function birthdayNumber(d) { return reduce(d); }
function personalYear(m, d, calYear) {
  return reduce(reduce(m) + reduce(d) + reduce(digitSum(calYear)), false); // 1-9
}
const LETTER_VALUES = { A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8,'Å':1,'Ä':1,'Ö':6,'É':5,'Ü':3 };
function nameNumber(name) {
  let sum = 0;
  for (const ch of (name || '').toUpperCase()) if (LETTER_VALUES[ch]) sum += LETTER_VALUES[ch];
  return sum ? reduce(sum) : null;
}

// ---------- Western zodiac ----------
const ZODIAC = [
  { key:'capricorn',  name:'Stenbocken', sym:'♑', from:[12,22], to:[1,19],  element:'Jord',   mod:'Kardinal' },
  { key:'aquarius',   name:'Vattumannen',sym:'♒', from:[1,20],  to:[2,18],  element:'Luft',   mod:'Fast' },
  { key:'pisces',     name:'Fiskarna',   sym:'♓', from:[2,19],  to:[3,20],  element:'Vatten', mod:'Rörlig' },
  { key:'aries',      name:'Väduren',    sym:'♈', from:[3,21],  to:[4,19],  element:'Eld',    mod:'Kardinal' },
  { key:'taurus',     name:'Oxen',       sym:'♉', from:[4,20],  to:[5,20],  element:'Jord',   mod:'Fast' },
  { key:'gemini',     name:'Tvillingarna',sym:'♊',from:[5,21],  to:[6,20],  element:'Luft',   mod:'Rörlig' },
  { key:'cancer',     name:'Kräftan',    sym:'♋', from:[6,21],  to:[7,22],  element:'Vatten', mod:'Kardinal' },
  { key:'leo',        name:'Lejonet',    sym:'♌', from:[7,23],  to:[8,22],  element:'Eld',    mod:'Fast' },
  { key:'virgo',      name:'Jungfrun',   sym:'♍', from:[8,23],  to:[9,22],  element:'Jord',   mod:'Rörlig' },
  { key:'libra',      name:'Vågen',      sym:'♎', from:[9,23],  to:[10,22], element:'Luft',   mod:'Kardinal' },
  { key:'scorpio',    name:'Skorpionen', sym:'♏', from:[10,23], to:[11,21], element:'Vatten', mod:'Fast' },
  { key:'sagittarius',name:'Skytten',    sym:'♐', from:[11,22], to:[12,21], element:'Eld',    mod:'Rörlig' },
];
function zodiacIndex(m, d) {
  for (let i = 0; i < 12; i++) {
    const z = ZODIAC[i];
    if (z.from[0] === 12) { // Capricorn wraps
      if ((m === 12 && d >= 22) || (m === 1 && d <= 19)) return i;
    } else if ((m === z.from[0] && d >= z.from[1]) || (m === z.to[0] && d <= z.to[1])) return i;
  }
  return 0;
}
// Degree around the zodiac wheel 0..360 (Aries 0°) for constellation placement
function zodiacDegree(m, d) {
  const start = new Date(2001, 2, 21); // Mar 21
  let t = new Date(2001, m - 1, d);
  if (t < start) t = new Date(2002, m - 1, d);
  return ((t - start) / 864e5) / 365 * 360;
}

// ---------- Chinese zodiac (solar calendar, year begins ~4 Feb / lichun) ----------
const ANIMALS = ['Råttan','Oxen','Tigern','Kaninen','Draken','Ormen','Hästen','Geten','Apan','Tuppen','Hunden','Grisen'];
const ANIMAL_EMOJI = ['🐀','🐂','🐅','🐇','🐉','🐍','🐎','🐐','🐒','🐓','🐕','🐖'];
const CN_ELEMENTS = ['Trä','Eld','Jord','Metall','Vatten'];
function chineseYear(y, m, d) { return (m === 1 || (m === 2 && d < 4)) ? y - 1 : y; }
function chineseZodiac(y, m, d) {
  const cy = chineseYear(y, m, d);
  const animal = ((cy - 4) % 12 + 12) % 12;
  const stem = ((cy - 4) % 10 + 10) % 10;
  return { animalIdx: animal, animal: ANIMALS[animal], emoji: ANIMAL_EMOJI[animal],
           element: CN_ELEMENTS[Math.floor(stem / 2)], yin: stem % 2 === 1, year: cy };
}
const TRINES = [[0,4,8],[1,5,9],[2,6,10],[3,7,11]];
const CLASHES = [[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];

// ---------- Biorhythm ----------
const CYCLES = { fysisk: 23, emotionell: 28, intellektuell: 33 };
function daysAlive(birth, at) {
  const b = Date.UTC(birth.year, birth.month - 1, birth.day);
  const t = Date.UTC(at.getFullYear(), at.getMonth(), at.getDate());
  return Math.round((t - b) / 864e5);
}
function biorhythm(birth, at) {
  const n = daysAlive(birth, at);
  const val = c => Math.sin(2 * Math.PI * n / c);
  return { n, fysisk: val(23), emotionell: val(28), intellektuell: val(33) };
}
// Phase sync between two people for one cycle: 100% = identical phase
function cycleSync(nA, nB, cycle) {
  const diff = ((nA - nB) % cycle + cycle) % cycle;
  const phase = Math.min(diff, cycle - diff) / (cycle / 2); // 0..1
  return Math.round((1 - phase) * 100);
}

// ---------- Signature profile (5 dimensions, 0-100, deterministic & explainable) ----------
const DIMS = ['Drivkraft','Känsla','Tanke','Stabilitet','Utstrålning'];
const ELEMENT_BASE = {
  'Eld':    [82, 56, 50, 42, 80],
  'Jord':   [58, 52, 62, 86, 50],
  'Luft':   [60, 50, 84, 46, 68],
  'Vatten': [50, 86, 58, 56, 56],
};
const LP_MOD = { // life path -> dimension deltas
  1:[14,-4,2,0,8], 2:[-6,12,2,6,-2], 3:[4,6,4,-8,14], 4:[0,-6,6,16,-6], 5:[10,2,6,-10,10],
  6:[-2,12,-2,10,4], 7:[-6,2,16,4,-8], 8:[14,-6,6,8,4], 9:[0,10,4,-2,8],
  11:[2,14,10,-6,10], 22:[10,0,10,14,2], 33:[0,16,4,8,10],
};
const TRINE_MOD = [ [6,-2,4,0,4], [0,-2,2,8,0], [8,4,-2,-4,6], [-4,8,2,2,2] ]; // per trine group
function signature(elementName, lp, animalIdx, birthdayNum) {
  const base = ELEMENT_BASE[elementName].slice();
  const lpm = LP_MOD[lp] || [0,0,0,0,0];
  const trine = TRINES.findIndex(t => t.includes(animalIdx));
  const tm = TRINE_MOD[trine];
  const bd = reduce(birthdayNum, false);
  return base.map((v, i) => {
    let x = v + lpm[i] + tm[i] + ((bd + i) % 3 - 1) * 3;
    return Math.max(15, Math.min(98, Math.round(x)));
  });
}

// ---------- Compatibility ----------
const ELEMENT_PAIR = {
  'Eld|Eld':84,'Jord|Jord':82,'Luft|Luft':83,'Vatten|Vatten':85,
  'Eld|Luft':90,'Luft|Eld':90,'Jord|Vatten':89,'Vatten|Jord':89,
  'Eld|Jord':58,'Jord|Eld':58,'Luft|Vatten':56,'Vatten|Luft':56,
  'Eld|Vatten':48,'Vatten|Eld':48,'Jord|Luft':52,'Luft|Jord':52,
};
function lpAffinity(a, b) {
  const ra = reduce(a, false), rb = reduce(b, false);
  if (ra === rb) return 78;
  const pairs = { '1|5':88,'1|7':82,'2|6':90,'2|8':84,'3|5':86,'3|9':88,'4|8':87,'4|6':82,'6|9':89,'7|9':80,'1|9':76,'2|4':80,'3|6':82,'5|7':79,'1|8':70,'2|7':72,'3|4':58,'4|5':55,'1|4':60,'5|6':62,'7|8':64,'2|9':74,'8|9':73,'1|2':68,'1|3':75,'1|6':66,'2|3':71,'2|5':60,'3|7':70,'3|8':63,'4|7':77,'4|9':65,'5|8':72,'5|9':69,'6|7':61,'6|8':67 };
  return pairs[`${Math.min(ra,rb)}|${Math.max(ra,rb)}`] ?? 65;
}
function chineseAffinity(ai, bi) {
  if (ai === bi) return 74;
  const sameTrine = TRINES.some(t => t.includes(ai) && t.includes(bi));
  if (sameTrine) return 92;
  const clash = CLASHES.some(([x,y]) => (x===ai&&y===bi)||(x===bi&&y===ai));
  if (clash) return 38;
  // "secret friends" (liu he) pairs
  const liuhe = [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
  if (liuhe.some(([x,y]) => (x===ai&&y===bi)||(x===bi&&y===ai))) return 86;
  return 64;

function signatureSimilarity(sa, sb) { // 0-100, 100 = identical shape
  let d = 0;
  for (let i = 0; i < 5; i++) d += Math.abs(sa[i] - sb[i]);
  return Math.max(0, Math.round(100 - d / 5 * 1.4));
}
function compatibility(A, B) { // A,B are computed profiles
  const el = ELEMENT_PAIR[`${A.zodiac.element}|${B.zodiac.element}`];
  const cn = chineseAffinity(A.chinese.animalIdx, B.chinese.animalIdx);
  const lp = lpAffinity(A.lifePath, B.lifePath);
  const sim = signatureSimilarity(A.signature, B.signature);
  const score = Math.round(el * 0.34 + cn * 0.30 + lp * 0.24 + sim * 0.12);
  return { score, el, cn, lp, sim };
}

// ---------- Full profile ----------
function computeProfile(person, at = new Date()) {
  const { year, month, day } = person;
  const zi = zodiacIndex(month, day);
  const z = ZODIAC[zi];
  const ch = chineseZodiac(year, month, day);
  const lp = lifePath(year, month, day);
  const bd = birthdayNumber(day);
  const py = personalYear(month, day, at.getFullYear());
  const nn = nameNumber(person.name);
  const sig = signature(z.element, lp, ch.animalIdx, day);
  const bio = biorhythm({ year, month, day }, at);
  const weekday = ['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'][new Date(year, month-1, day).getDay()];
  return { ...person, zodiacIdx: zi, zodiac: z, chinese: ch, lifePath: lp, birthdayNum: bd,
           personalYear: py, nameNum: nn, signature: sig, bio, weekday,
           degree: zodiacDegree(month, day) };
}

return { luhnCheck, parsePersonnummer, parseBirthdate, reduce, lifePath, birthdayNumber,
         personalYear, nameNumber, ZODIAC, zodiacIndex, zodiacDegree, ANIMALS, ANIMAL_EMOJI,
         chineseZodiac, chineseYear, TRINES, CLASHES, CYCLES, daysAlive, biorhythm, cycleSync,
         DIMS, signature, compatibility, computeProfile, signatureSimilarity };
})();
Object.assign(window, KE);

/* Six digits YYMMDD -> birth date. Century inferred (<= current yy => 20xx), flippable when ambiguous. */
function parseSixDigits(str,century){
  const d=String(str||'').replace(/\D/g,'');
  if(d.length!==6) return {ok:false,error:'format'};
  const yy=+d.slice(0,2), mm=+d.slice(2,4), dd=+d.slice(4,6);
  const nowYY=new Date().getFullYear()%100;
  const ambiguous=yy<=nowYY;
  let year=century?(century+yy):(ambiguous?2000+yy:1900+yy);
  if(mm<1||mm>12) return {ok:false,error:'date'};
  const dim=new Date(year,mm,0).getDate();
  if(dd<1||dd>dim) return {ok:false,error:'date'};
  if(new Date(year,mm-1,dd)>new Date()) return {ok:false,error:'future'};
  return {ok:true,year,month:mm,day:dd,ambiguous,six:d};
}

const SKEY='konstellation.v1';
async function loadState(){
  try{ if(window.storage){ const r=await window.storage.get(SKEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
  try{ const r=localStorage.getItem(SKEY); if(r) return JSON.parse(r); }catch(e){}
  return null;
}

}

/* --- share code --- */
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; return decodeURIComponent(escape(atob(s))); }
function shareCode(p){ const a=[p.name,`${p.year}${String(p.month).padStart(2,'0')}${String(p.day).padStart(2,'0')}`]; if(p.plus4)a.push(p.plus4); return 'KON1.'+b64e(JSON.stringify(a)); }
function parseShareCode(code){
  try{
    const m=(code||'').trim().match(/KON1\.([A-Za-z0-9_-]+)/); if(!m) return null;
    const [name,ymd,p4]=JSON.parse(b64d(m[1]));
    const year=+ymd.slice(0,4),month=+ymd.slice(4,6),day=+ymd.slice(6,8);
    const chk=parseBirthdate(year,month,day); if(!chk.ok||!name) return null;
    const out={name:String(name).slice(0,60),year,month,day};
    if(typeof p4==='string'&&/^\d{4}$/.test(p4))out.plus4=p4;
    return out;
  }catch(e){ return null; }
}

function svgRadar(sigs,size=230,opts={}){ // sigs: [{values,color,fill}]
  const cx=size/2, cy=size/2+4, R=size/2-36, N=5;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let s=`<svg viewBox="0 0 ${size} ${size+6}" width="100%" role="img" aria-label="Signaturdiagram">`;
  for(const f of [.33,.66,1]){ s+=`<polygon points="${[...Array(N)].map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="rgba(160,175,210,.14)" stroke-width="1"/>`; }
  for(let i=0;i<N;i++){ const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(160,175,210,.1)"/>`; }
  for(const g of sigs){
    const pts=g.values.map((v,i)=>pt(i,R*v/100).join(',')).join(' ');
    s+=`<polygon points="${pts}" fill="${g.fill}" stroke="${g.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
    for(let i=0;i<N;i++){const [x,y]=pt(i,R*g.values[i]/100);s+=`<circle cx="${x}" cy="${y}" r="2.6" fill="${g.color}"/>`;}
  }
  const labs=C.dims.map(d=>d.k);
  for(let i=0;i<N;i++){ const [x,y]=pt(i,R+19); s+=`<text x="${x}" y="${y+3}" text-anchor="middle" font-size="10" letter-spacing=".05em" fill="#8E96AE" font-family="Sora,sans-serif">${labs[i]}</text>`; }
  return s+'</svg>';
}
function svgBio(birth,days=15,W=352,H=150){
  const today=NOW(); const n0=daysAlive(birth,today);
  const cols={fysisk:'var(--eld)',emotionell:'var(--vatten)',intellektuell:'var(--luft)'};
  const X=d=>18+( (d+days)/(2*days) )*(W-32), Y=v=>H/2-(v*(H/2-20));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biorytmkurvor">
  <line x1="14" y1="${H/2}" x2="${W-14}" y2="${H/2}" stroke="rgba(160,175,210,.18)" stroke-dasharray="2 4"/>
  <line x1="${X(0)}" y1="14" x2="${X(0)}" y2="${H-14}" stroke="rgba(232,199,118,.4)"/>
  <text x="${X(0)}" y="11" text-anchor="middle" font-size="9" fill="var(--gold)" font-family="Sora" letter-spacing=".1em">IDAG</text>
  <text x="16" y="${H-4}" font-size="9" fill="#5B6379" font-family="Sora">−${days} dagar</text>
  <text x="${W-16}" y="${H-4}" text-anchor="end" font-size="9" fill="#5B6379" font-family="Sora">+${days}</text>`;
  for(const [key,cyc] of Object.entries(CYCLES)){
    let d='';
    for(let x=-days;x<=days;x+=0.5){ const v=Math.sin(2*Math.PI*(n0+x)/cyc); d+=(x===-days?'M':'L')+X(x).toFixed(1)+' '+Y(v).toFixed(1)+' '; }
    s+=`<path d="${d}" fill="none" stroke="${cols[key]}" stroke-width="1.8" opacity=".9"/>`;
    const v0=Math.sin(2*Math.PI*n0/cyc);
    s+=`<circle cx="${X(0)}" cy="${Y(v0)}" r="3.4" fill="${cols[key]}"/>`;
  }
  return s+'</svg>';
}
function svgDial(score,color='var(--gold)'){
  const r=62,c=2*Math.PI*r,off=c*(1-score/100);
  return `<svg width="150" height="150" viewBox="0 0 150 150">
  <circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9"/>
  <circle cx="75" cy="75" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}
/* Constellation of the circle */
function svgConstellation(people,filterIds){
  const W=380,H=330,cx=W/2,cy=H/2+6,R=126;
  const me=meProf();
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="touch-action:manipulation">`;
  // faint zodiac ring + season ticks
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(160,175,210,.12)" stroke-dasharray="1 5"/>`;
  const active=p=>!filterIds||filterIds.has(p.id);
  const placed=people.map(p=>{
    const pr=prof(p), a=(pr.degree-90)*Math.PI/180;
    return {p,pr,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),comp:compatibility(me,pr).score};
  });
  // lines me->person
  for(const q of placed){
    const on=active(q.p), op=on?(0.12+q.comp/100*.55):.05;
    s+=`<line x1="${cx}" y1="${cy}" x2="${q.x}" y2="${q.y}" stroke="var(--gold)" stroke-width="${on?1:0.6}" opacity="${op.toFixed(2)}"/>`;
  }
  // lines between same-group strong pairs (subtle web)
  for(let i=0;i<placed.length;i++)for(let j=i+1;j<placed.length;j++){
    const a=placed[i],b=placed[j];
    if(!active(a.p)||!active(b.p))continue;
    const sc=compatibility(a.pr,b.pr).score;
    if(sc>=80) s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--vatten)" stroke-width=".7" opacity=".22"/>`;
  }
  // me star
  s+=`<g><circle cx="${cx}" cy="${cy}" r="13" fill="rgba(232,199,118,.14)"/><circle cx="${cx}" cy="${cy}" r="5.5" fill="var(--gold)"/>
      <circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="var(--gold)" opacity=".5"/>
      <text x="${cx}" y="${cy+27}" text-anchor="middle" font-size="10" fill="var(--gold)" font-family="Sora" letter-spacing=".14em">DU</text></g>`;
  // person stars
  for(const q of placed){
    const on=active(q.p), col=elColor(q.pr.zodiac.element), rr=on?(4+q.comp/28):3;
    s+=`<g class="cstar" data-pid="${q.p.id}" style="cursor:pointer">
      <circle cx="${q.x}" cy="${q.y}" r="16" fill="transparent"/>
      <circle cx="${q.x}" cy="${q.y}" r="${rr.toFixed(1)}" fill="${col}" opacity="${on?.95:.28}">${on?`<animate attributeName="opacity" values=".95;.6;.95" dur="${(2.5+q.comp/40).toFixed(1)}s" repeatCount="indefinite"/>`:''}</circle>
      <text x="${q.x}" y="${q.y-11}" text-anchor="middle" font-size="9.5" fill="${on?'#C7CEE2':'#4A526A'}" font-family="Sora">${esc(firstName(q.p.name))}</text></g>`;
  }
  return s+'</svg>';
}

function paintSky(){
  const cv=$('#sky'),fr=$('#frame');
  cv.width=fr.clientWidth*2; cv.height=fr.clientHeight*2;
  const g=cv.getContext('2d'); g.scale(2,2);
  const W=fr.clientWidth,H=fr.clientHeight;
  for(let i=0;i<90;i++){
    const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.1+.2;
    g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=`rgba(${200+Math.random()*55|0},${205+Math.random()*40|0},240,${.12+Math.random()*.5})`;g.fill();
  }
}

function bestBioDay(birth){ // next day within 10 days where sum of cycles is max
  let best={d:0,s:-9};
  for(let d=0;d<=10;d++){

  }
  return best.d;
}

function cmpOverview(){
  const me=meProf();
  const list=(cmpOvFilter?membersOf(cmpOvFilter):S.people)

      const deep=(S.me.plus4&&p.plus4)?deepCompatibility(me,pr):null;

  const rows=list.map((r,i)=>{

      for(let d=0;d<=14;d++){const at=new Date(NOW().getFullYear(),NOW().getMonth(),NOW().getDate()+d);
        const v=all.reduce((s,P)=>s+selfEnergy(P,at),0)/all.length;
        if(v>best.v)best={d,v,at};}
      return `<p class="small muted mt6">Räknat på allas biorytmer — din inräknad — toppar gruppens samlade energi <b style="color:var(--gold)">${best.d===0?'idag':fmtShort(best.at)}</b> (${Math.round(best.v*100)} av 100). ${best.d===0?'Ring dem nu.':'En bra dag för '+g.emoji+' '+esc(g.name.toLowerCase())+' att ses.'}</p>`})()}
  </section><section class="card gold fadein">

    <h3 class="disp mt10">Gruppens karaktär</h3>
    <p class="small muted mt6">${elDom} Livstalen spänner över ${lps.join(', ')} och årsdjuren räknar ${animals.length} av tolv: ${animals.map(a=>a.toLowerCase()).join(', ')}.</p>
    ${['Eld','Jord','Luft','Vatten'].map(e=>`<div class="barrow"><span class="lab tx-${e}">${e}</span><div class="bar"><i style="width:${Math.round(elCount[e]/members.length*100)}%;background:${elColor(e)}"></i></div><span class="pct num">${elCount[e]}</span></div>`).join('')}

      <p class="muted" style="margin-top:3px">${C.scoreBand(worst.sc)[1]}</p></div>

}

/* --- QR rendering: qrcodejs via CDN, deterministic glyph fallback --- */
function renderQR(){
  const box=$('#qrbox'); if(!box)return;
  const code=shareCode(S.me);
  box.innerHTML='';
  if(window.QRCode){
    try{ new QRCode(box,{text:code,width:184,height:184,colorDark:'#141B30',colorLight:'#F3EFE4',correctLevel:QRCode.CorrectLevel.M}); return; }catch(e){}
  }
  // fallback: deterministic identity glyph (still scannable-agnostic visual)
  let h=0; for(const ch of code) h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967295;};
  let cells='';
  for(let y=0;y<13;y++)for(let x=0;x<7;x++){ if(rnd()>.5){cells+=`<rect x="${x*14}" y="${y*14}" width="13" height="13" rx="2.5"/><rect x="${(12-x)*14}" y="${y*14}" width="13" height="13" rx="2.5"/>`;} }
  box.innerHTML=`<svg viewBox="0 0 182 182" width="184" height="184" fill="#141B30">${cells}</svg>`;
}

/* --- Reveal sequence --- */
function playReveal(me,done){
  const rd=$('#reveal'),st=$('#revealStage'),tx=$('#revealTxt');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){done();return;}
  const digits=`${String(me.year%100).padStart(2,'0')}${String(me.month).padStart(2,'0')}${String(me.day).padStart(2,'0')}`.split('');
  st.innerHTML=digits.map((d,i)=>`<span class="d" style="transform:translate(-50%,-50%) translate(${(i-digits.length/2+.5)*24}px,0)">${d}</span>`).join('');
  rd.classList.add('show'); tx.textContent='Läser dina siffror …';
  const ds=st.querySelectorAll('.d');
  requestAnimationFrame(()=>ds.forEach(d=>d.style.opacity=1));
  setTimeout(()=>{ // scatter into orbit
    tx.textContent='Ritar din stjärnbild …';
    ds.forEach((d,i)=>{const a=i/ds.length*2*Math.PI-Math.PI/2,r=95+(i%3)*14;
      d.style.transform=`translate(-50%,-50%) translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.8)`;d.style.opacity=.85;});
  },1000);
  setTimeout(()=>{ // collapse to star
    tx.textContent='Din himmel är klar.';
    ds.forEach(d=>{d.style.transform='translate(-50%,-50%) scale(.2)';d.style.opacity=0;});
    st.insertAdjacentHTML('beforeend','<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;color:var(--gold);animation:fin .8s both">✦</div>');
  },2600);
  setTimeout(()=>{rd.classList.remove('show');setTimeout(done,300);},3700);
}

function moonPhase(date){
  const days=(date.getTime()-NEWMOON_REF)/864e5;
  const frac=(((days%SYNODIC)+SYNODIC)%SYNODIC)/SYNODIC;
  return {idx:Math.round(frac*8)%8, frac};
}

function personalDay(month,day,at){
  const py=personalYear(month,day,at.getFullYear());
  return reduce(reduce(py+at.getMonth()+1,false)+at.getDate(),false);
}
C.personalDay={1:'starta något',2:'lyssna & vänta in',3:'uttryck dig',4:'bygg & ordna',5:'byt spår, rör dig',6:'ta hand om ditt & dina',7:'gå inåt, tänk klart',8:'förhandla & skörda',9:'avsluta & släpp'};
const PD_Q={1:.9,2:.5,3:.8,4:.55,5:.75,6:.7,7:.5,8:.85,9:.6};
function powerDays(p,horizon=30,count=3){
  const out=[];
  for(let d=1;d<=horizon;d++){
    const at=new Date(NOW().getFullYear(),NOW().getMonth(),NOW().getDate()+d);
    const b=biorhythm({year:p.year,month:p.month,day:p.day},at);
    const bio=(.4*(b.fysisk+1)/2+.35*(b.emotionell+1)/2+.25*(b.intellektuell+1)/2);
    const pd=personalDay(p.month,p.day,at);
    out.push({at,pd,bio,score:bio*.72+PD_Q[pd]*.28});
  }
  return out.sort((a,b)=>b.score-a.score).slice(0,count).sort((a,b)=>a.at-b.at);
}

function svgYearRing(py){
  const size=210,cx=size/2,cy=size/2,R=76;
  let s=`<svg viewBox="0 0 ${size} ${size}" style="max-width:210px;display:block;margin:0 auto">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1"/>`;
  for(let i=1;i<=9;i++){
    const a=(i-1)/9*2*Math.PI-Math.PI/2, x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R, on=i===py;
    if(on)s+=`<circle cx="${x}" cy="${y}" r="17" fill="rgba(232,199,118,.13)" stroke="var(--gold)" stroke-width="1.4"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${on?4:2.6}" fill="${on?'var(--gold)':'rgba(255,255,255,.3)'}"/>`;
    s+=`<text x="${x}" y="${y-(on?9:7)}" text-anchor="middle" font-size="${on?12:9.5}" fill="${on?'var(--gold)':'rgba(255,255,255,.42)'}" font-family="var(--disp)">${i}</text>`;
  }
  s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.5)">år ${py} av 9</text>`;
  s+=`<text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="12" fill="var(--gold)" font-family="var(--disp)">${C.personalYear[py].tema}</text>`;
  return s+'</svg>';
}
/* rytm-samstämdhet idag, snitt över tre cykler */
function todaySync(a,b){
  const na=daysAlive({year:a.year,month:a.month,day:a.day},NOW()), nb=daysAlive({year:b.year,month:b.month,day:b.day},NOW());
  return Math.round((cycleSync(na,nb,23)+cycleSync(na,nb,28)+cycleSync(na,nb,33))/3);
}


/* ================= V3: DJUPSIGNATUR (+4), GEMENSAM ENERGI, KRITISKA DAGAR ================= */
function sixOf(p){ return `${String(p.year%100).padStart(2,'0')}${String(p.month).padStart(2,'0')}${String(p.day).padStart(2,'0')}`; }
function sumD(str){ return String(str).split('').reduce((a,c)=>a+ +c,0); }
function deepNumber(p){ if(!p.plus4)return null; return reduce(sumD(sixOf(p)+p.plus4),true); }
function digitCounts(p){ // counts of 1-9 across all 10 digits
  const c={}; for(let i=1;i<=9;i++)c[i]=0;
  for(const d of sixOf(p)+(p.plus4||'')) if(d!=='0')c[+d]++;
  return c;
}
function leadDigit(p){ const c=digitCounts(p); let best=1; for(let i=2;i<=9;i++)if(c[i]>c[best])best=i; return c[best]>0?best:null; }
function digitSimilarity(a,b){ // cosine of digit-count vectors
  const ca=digitCounts(a),cb=digitCounts(b); let dot=0,na=0,nb=0;
  for(let i=1;i<=9;i++){dot+=ca[i]*cb[i];na+=ca[i]**2;nb+=cb[i]**2;}
  return na&&nb?dot/Math.sqrt(na*nb):0;
}
function sharedDigits(a,b){ const ca=digitCounts(a),cb=digitCounts(b),out=[];
  for(let i=1;i<=9;i++)if(ca[i]&&cb[i])out.push(i); return out; }
const triad=n=>n===11?2:n===22?4:n===33?6:n; // masters join their root families
function deepAffinity(a,b){
  if(a===b)return 92;
  if([11,22,33].includes(a)&&[11,22,33].includes(b))return 86;
  const fam=x=>[[1,5,7],[2,4,8],[3,6,9]].findIndex(f=>f.includes(triad(x)%9===0?9:((triad(x)-1)%9)+1));
  return fam(a)===fam(b)?80:62;
}
function deepCompatibility(A,B){ // requires plus4 on both
  if(!A.plus4||!B.plus4)return null;
  const base=compatibility(A,B).score, dA=deepNumber(A), dB=deepNumber(B);
  const aff=deepAffinity(dA,dB), sim=digitSimilarity(A,B);
  return {score:Math.round(base*0.55+aff*0.27+sim*100*0.18), dA, dB, aff, shared:sharedDigits(A,B), sim};
}
/* Gemensam energi: hur höga båda är samtidigt (0-100) — varierar över tid, till skillnad från fasen */
function jointEnergy(A,B,at){
  const a=biorhythm({year:A.year,month:A.month,day:A.day},at), b=biorhythm({year:B.year,month:B.month,day:B.day},at);
  let s=0; for(const k of ['fysisk','emotionell','intellektuell']) s+=Math.sqrt(((a[k]+1)/2)*((b[k]+1)/2));
  return Math.round(s/3*100);
}
function jointSeries(A,B,days=30){ const out=[];
  for(let d=0;d<=days;d++){const at=new Date(NOW().getFullYear(),NOW().getMonth(),NOW().getDate()+d);out.push({d,at,v:jointEnergy(A,B,at)});}
  return out; }
function energyTrend(A,B){ // idag vs snitt +3..+9 dagar
  const now=jointEnergy(A,B,NOW()); let s=0;
  for(let d=3;d<=9;d++)s+=jointEnergy(A,B,new Date(NOW().getFullYear(),NOW().getMonth(),NOW().getDate()+d));
  const diff=s/7-now; return diff>4?1:diff<-4?-1:0;
}
function criticalDays(p,horizon=14){ // cykel korsar noll = omställningsdag
  const out=[], names={fysisk:'fysisk',emotionell:'emotionell',intellektuell:'intellektuell'};
  let prev=biorhythm({year:p.year,month:p.month,day:p.day},NOW());
  for(let d=1;d<=horizon;d++){
    const at=new Date(NOW().getFullYear(),NOW().getMonth(),NOW().getDate()+d);
    const b=biorhythm({year:p.year,month:p.month,day:p.day},at);
    for(const k of Object.keys(names)) if(Math.sign(b[k])!==Math.sign(prev[k])&&out.length<3) out.push({d,at,cycle:names[k],rising:b[k]>prev[k]});
    prev=b;
  }
  return out;
}
function selfEnergy(p,at){ const b=biorhythm({year:p.year,month:p.month,day:p.day},at);
  return (.4*(b.fysisk+1)/2+.35*(b.emotionell+1)/2+.25*(b.intellektuell+1)/2); }
function svgSpark(series,W=352,H=84,marks=true){
  const max=Math.max(...series.map(s=>s.v)),min=Math.min(...series.map(s=>s.v));
  const X=i=>14+i/(series.length-1)*(W-28), Y=v=>H-16-((v-min)/Math.max(1,max-min))*(H-34);
  let path='M'+series.map((s,i)=>`${X(i).toFixed(1)},${Y(s.v).toFixed(1)}`).join(' L');
  const pk=series.reduce((a,b)=>b.v>a.v?b:a), lo=series.reduce((a,b)=>b.v<a.v?b:a);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" aria-label="Energiprognos">
  <line x1="14" x2="${W-14}" y1="${H-16}" y2="${H-16}" stroke="rgba(160,175,210,.15)"/>
  <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="${path} L${X(series.length-1)},${H-16} L14,${H-16} Z" fill="rgba(232,199,118,.07)" stroke="none"/>`;
  if(marks){
    s+=`<circle cx="${X(series.indexOf(pk))}" cy="${Y(pk.v)}" r="3.4" fill="var(--gold)"/>`;
    s+=`<circle cx="${X(series.indexOf(lo))}" cy="${Y(lo.v)}" r="3" fill="none" stroke="rgba(160,175,210,.6)" stroke-width="1.2"/>`;
    s+=`<circle cx="${X(0)}" cy="${Y(series[0].v)}" r="2.6" fill="#fff" opacity=".8"/>`;
    s+=`<text x="14" y="${H-3}" font-size="9" fill="rgba(255,255,255,.4)">idag</text>`;
    s+=`<text x="${W-14}" y="${H-3}" font-size="9" text-anchor="end" fill="rgba(255,255,255,.4)">+30 d</text>`;
  }
  return s+'</svg>';
}

/* Parvisa insikter: styrkan, skavet, det intressanta */
function pairInsights(A,B,c){
  const parts=[{k:'el',v:c.el,pos:'elementen förstärker varandra',neg:'elementen drar åt olika håll'},
               {k:'cn',v:c.cn,pos:'årsdjuren hör ihop',neg:'årsdjuren skaver'},
               {k:'lp',v:c.lp,pos:'livstalen talar samma språk',neg:'livstalen har olika tempo'},
               {k:'sim',v:c.sim,pos:'signaturerna är påfallande lika',neg:'signaturerna är varandras kontrast'}];
  const hi=parts.reduce((a,b)=>b.v>a.v?b:a), lo=parts.reduce((a,b)=>b.v<a.v?b:a);
  const styrka={el:`${A.zodiac.element} möter ${B.zodiac.element.toLowerCase()} — ${hi.pos}. Det är grundackordet i er relation, det som bär när annat gnisslar.`,
    cn:`${A.chinese.animal} och ${B.chinese.animal.toLowerCase()} — ${hi.pos}. En vänskap årsdjuren skrivit under på i förväg.`,
    lp:`Livstal ${A.lifePath} och ${B.lifePath} — ${hi.pos}. Ni förstår varandras sätt att vilja saker.`,
    sim:`Era signaturer ligger nära varandra — ${hi.pos}. Ni känner igen er i varandras sätt att vara.`}[hi.k];
  const skav={el:`${lo.neg}: ${A.zodiac.element.toLowerCase()} och ${B.zodiac.element.toLowerCase()} behöver översätta sig för varandra. Räkna med olika standardlägen.`,
    cn:`${lo.neg} — ${A.chinese.animal.toLowerCase()} och ${B.chinese.animal.toLowerCase()} tar inte alltid samma väg. Ge varandra omvägarna.`,
    lp:`${lo.neg}: talen ${A.lifePath} och ${B.lifePath} vill olika fort. Den som väntar gör det av kärlek.`,
    sim:`${lo.neg} — ni fyller i varandras luckor snarare än speglar varandra. Styrka, om ni låter det vara det.`}[lo.k];
  // det intressanta: samla kuriosa, ta de 2 bästa
  const facts=[];
  const mA=moonPhase(new Date(A.year,A.month-1,A.day,12)), mB=moonPhase(new Date(B.year,B.month-1,B.day,12));
  if(mA.idx===mB.idx)facts.push(`Ni föddes båda under ${C.moon[mA.idx].name.toLowerCase()} — samma himmel, olika år.`);
  if(Math.abs(A.zodiacIdx-B.zodiacIdx)===6)facts.push('Era stjärntecken står mitt emot varandra på zodiakhjulet — klassiska spegelpar som lär varandra det de själva saknar.');
  if(A.weekday===B.weekday)facts.push(`Båda födda på en ${A.weekday} — ${C.weekdayLore[A.weekday]}.`);
  if(A.chinese.animalIdx===B.chinese.animalIdx)facts.push(`Samma årsdjur — ${A.chinese.animal.toLowerCase()} känner igen ${B.chinese.animal.toLowerCase()}.`);
  const dd=Math.abs(A.bio.n-B.bio.n);
  facts.push(`Det skiljer ${dd.toLocaleString('sv-SE')} dagar mellan er — ${dd%7===0?'jämnt antal veckor, era veckodagar löper i takt':dd<3000?'nästan jämnåriga i dagar räknat':'olika kapitel av samma tid'}.`);
  if(A.plus4&&B.plus4){const sh=sharedDigits(A,B); if(sh.length>=3)facts.push(`Tre eller fler gemensamma siffror i era tio — ovanligt likt material.`);}
  return {styrka,skav,facts:facts.slice(0,2),hi,lo};
}
